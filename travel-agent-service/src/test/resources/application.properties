# Used only by ToolExecutorTest (unit, no context) and the *IT integration
# tests (client/*IT.java). The IT tests load the full Spring context to get
# real @LoadBalanced + Eureka-backed client beans, which pulls in
# AnthropicClient's bean definition too — it needs *a* value for
# anthropic.api-key to construct, even though none of these tests call it.
anthropic.api-key=test-key-unused-by-client-integration-tests
