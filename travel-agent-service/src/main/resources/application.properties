server.port=8088
spring.application.name=travel-agent-service

# ── Eureka ──────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── Anthropic ───────────────────────────────────────────────────────────────
# No default on purpose — Spring fails fast at startup if ANTHROPIC_API_KEY
# isn't set, instead of failing later on the first real chat request.
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-6}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics

# ── Distributed Tracing (Micrometer Tracing + OpenTelemetry -> OTLP -> Zipkin) ─
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ── Centralized Logging (JSON logs -> Logstash -> Elasticsearch/Kibana) ─────
logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}
