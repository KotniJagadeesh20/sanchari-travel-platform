server.port=8082
spring.application.name=bus-booking-service

# ── Database (own schema, separate from every other service) ───────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_bus_booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Eureka ──────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── Notification Service (internal, service-to-service call) ────────────────
# See NotificationClientImpl — fire-and-forget, never blocks or fails a booking.
notification.internal.api-key=${NOTIFICATION_INTERNAL_API_KEY:local-dev-internal-key}

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics

# ── Distributed Tracing (Micrometer Tracing + OpenTelemetry -> OTLP -> Zipkin) ─
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ── Centralized Logging (JSON logs -> Logstash -> Elasticsearch/Kibana) ─────
# See logback-spring.xml. Best-effort/async — a Logstash outage never blocks
# or fails a request, same fire-and-forget principle as the notification client.
logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}
