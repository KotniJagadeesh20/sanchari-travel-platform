# Receives structured JSON log lines from every service's LogstashTcpSocketAppender
# (see each service's src/main/resources/logback-spring.xml) and forwards them into
# Elasticsearch, one index per service per day, correlatable by traceId/spanId.

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # logstash-logback-encoder already emits an ISO-8601 @timestamp and a "service"
  # field (set from spring.application.name) plus traceId/spanId when present —
  # nothing further to parse.
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "travel-platform-%{[service]}-%{+YYYY.MM.dd}"
  }
}
