# Travel Platform — full local stack.
#
# Usage:
#   docker-compose up --build        # first run, or after code changes
#   docker-compose up -d             # subsequent runs, detached
#   docker-compose down               # stop everything
#   docker-compose down -v            # stop AND wipe the postgres data volume
#
# Startup order is enforced via `depends_on: condition: service_healthy`,
# not just container-start order — a service won't start until Postgres is
# actually accepting connections and Eureka is actually serving requests,
# not just "the container process began."

version: "3.9"

services:

  # ── Database ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: travel-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres   # default DB; the init script creates the other 4
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - travel-net

  # ── Distributed Tracing ──────────────────────────────────────────────────
  # Every service exports spans here via Micrometer Tracing + OpenTelemetry (OTLP).
  # http://localhost:9411 — search by traceId (also visible in log lines) to
  # see a request's full hop-by-hop path across services.
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: travel-zipkin
    environment:
      COLLECTOR_OTLP_HTTP_ENABLED: "true"
    ports:
      - "9411:9411"  # Zipkin UI
      - "4318:4318"  # OTLP/HTTP receiver — services export spans here
    networks:
      - travel-net

  # ── Centralized Logging (ELK) ────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: travel-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - travel-net

  # Every service ships structured JSON logs here over TCP (see each service's
  # logback-spring.xml). Logstash forwards them into Elasticsearch, tagged
  # with the originating service name and correlated by traceId/spanId.
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: travel-logstash
    volumes:
      - ./docker/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "5000:5000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - travel-net

  # Browse/search centralized logs at http://localhost:5601
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: travel-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - travel-net

  # ── Service Discovery ───────────────────────────────────────────────────
  service-registry:
    build:
      context: .
      dockerfile: service-registry/Dockerfile
    container_name: travel-service-registry
    environment:
      EUREKA_HOSTNAME: service-registry
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    ports:
      - "8761:8761"
    depends_on:
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - travel-net

  # ── Auth Service ────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: travel-auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_auth_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env — see .env.example}
      EUREKA_URI: http://service-registry:8761/eureka/
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # No `ports:` — only api-gateway, service-registry (Eureka UI), Mailhog,
    # and the observability stack are published to the host. This service
    # trusts X-Authenticated-* headers on the assumption that only the
    # gateway can reach it (see JwtAuthFilter/ downstream SecurityConfig) —
    # publishing its port to the host would let anyone on localhost forge
    # those headers directly, bypassing auth entirely. `expose` documents
    # the port without publishing it; containers on `travel-net` can still
    # reach it by container name regardless (that's how api-gateway/Eureka
    # already talk to it), `expose` is belt-and-suspenders documentation.
    expose:
      - "8081"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── Bus Booking Service ─────────────────────────────────────────────────
  bus-booking-service:
    build:
      context: .
      dockerfile: bus-booking-service/Dockerfile
    container_name: travel-bus-booking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_bus_booking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URI: http://service-registry:8761/eureka/
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above — same reasoning applies to
    # every domain service that trusts gateway-forwarded X-Authenticated-*
    # headers.
    expose:
      - "8082"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── Ride Share Service ──────────────────────────────────────────────────
  ride-share-service:
    build:
      context: .
      dockerfile: ride-share-service/Dockerfile
    container_name: travel-ride-share-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_rideshare_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URI: http://service-registry:8761/eureka/
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above.
    expose:
      - "8083"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── Travel Packages + Destinations Service ──────────────────────────────
  travel-packages-service:
    build:
      context: .
      dockerfile: travel-packages-service/Dockerfile
    container_name: travel-packages-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_packages_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URI: http://service-registry:8761/eureka/
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above.
    expose:
      - "8084"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── Mailhog (fake SMTP server for local email testing) ──────────────────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: travel-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI — view every email notification-service sends
    networks:
      - travel-net

  # ── Notification Service ─────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: travel-notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URI: http://service-registry:8761/eureka/
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above.
    expose:
      - "8086"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      mailhog:
        condition: service_started
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8086/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── Hotel Service ────────────────────────────────────────────────────────
  hotel-service:
    build:
      context: .
      dockerfile: hotel-service/Dockerfile
    container_name: travel-hotel-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/travel_hotel_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      EUREKA_URI: http://service-registry:8761/eureka/
      NOTIFICATION_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:?NOTIFICATION_INTERNAL_API_KEY must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above.
    expose:
      - "8085"
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── AI Travel Agent ──────────────────────────────────────────────────────
  # No database of its own — it's a pure orchestrator calling the domain
  # services above via Eureka. Needs ANTHROPIC_API_KEY set in the environment
  # (or a .env file) before starting; the app fails fast at startup if it's
  # missing.
  travel-agent-service:
    build:
      context: .
      dockerfile: travel-agent-service/Dockerfile
    container_name: travel-agent-service
    environment:
      EUREKA_URI: http://service-registry:8761/eureka/
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    # See auth-service's `expose` comment above — same header-trust pattern
    # (this service's own JwtValidator explicitly says so, see its Javadoc).
    expose:
      - "8088"
    depends_on:
      service-registry:
        condition: service_healthy
      travel-packages-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      bus-booking-service:
        condition: service_healthy
      ride-share-service:
        condition: service_healthy
      zipkin:
        condition: service_started
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travel-net

  # ── API Gateway ──────────────────────────────────────────────────────────
  # Starts last — waits on every domain service being healthy so the first
  # requests it routes don't hit a service that's still booting.
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: travel-api-gateway
    environment:
      EUREKA_URI: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in your .env — see .env.example}
      OTLP_ENDPOINT: http://zipkin:4318/v1/traces
      LOGSTASH_HOST: logstash
      LOGSTASH_PORT: 5000
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      bus-booking-service:
        condition: service_healthy
      ride-share-service:
        condition: service_healthy
      travel-packages-service:
        condition: service_healthy
      hotel-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      travel-agent-service:
        condition: service_healthy
    networks:
      - travel-net

volumes:
  postgres-data:
  elasticsearch-data:

networks:
  travel-net:
    driver: bridge
