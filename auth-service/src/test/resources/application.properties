spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# jwt.secret has no default in the real application.properties (see #2 —
# externalized, fails fast if unset) — AuthServiceApplicationTests boots the
# full context via @SpringBootTest, so it needs some value here or context
# load fails outside any environment that happens to export JWT_SECRET.
# Test-only value, never used to sign anything real.
jwt.secret=test-only-secret-for-context-loading-not-a-real-key
