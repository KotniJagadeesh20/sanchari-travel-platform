server.port=8086
spring.application.name=notification-service

# ── Database (own schema) ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Eureka ──────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ── Mail ────────────────────────────────────────────────────────────────────
# Points at Mailhog locally (docker-compose) — a fake SMTP server with a web UI
# at http://localhost:8025, so email sending is fully testable without a real
# provider. Swap host/port/username/password for SES/SendGrid/etc in prod.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
notification.email.from=no-reply@travelplatform.example

# Feature flag — lets email be disabled entirely (e.g. in tests, or if Mailhog
# isn't running) without touching code. In-app notifications are unaffected.
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}

# ── Internal service-to-service auth ─────────────────────────────────────────
# Guards /internal/** (see InternalApiKeyFilter). Not routed through the API
# Gateway at all — only reachable by other containers on the Docker network.
# Override via env in production; this default is fine for local dev only.
notification.internal.api-key=${NOTIFICATION_INTERNAL_API_KEY:local-dev-internal-key}

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics

# ── Distributed Tracing (Micrometer Tracing + OpenTelemetry -> OTLP -> Zipkin) ─
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# ── Centralized Logging (JSON logs -> Logstash -> Elasticsearch/Kibana) ─────
# See logback-spring.xml. Best-effort/async — a Logstash outage never blocks
# or fails a request, same fire-and-forget principle as the notification client.
logstash.host=${LOGSTASH_HOST:localhost}
logstash.port=${LOGSTASH_PORT:5000}
