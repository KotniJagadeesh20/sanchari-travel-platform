server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: bus-booking-service
          uri: lb://bus-booking-service
          predicates:
            - Path=/api/**, /admin/**

        - id: ride-share-service
          uri: lb://ride-share-service
          predicates:
            - Path=/rides/**

        - id: travel-packages-service
          uri: lb://travel-packages-service
          predicates:
            - Path=/packages/**, /destinations/**

        - id: hotel-service
          uri: lb://hotel-service
          predicates:
            - Path=/hotels/**, /hotel-bookings/**

        # Only /notifications/** is routed — /internal/** (notification creation)
        # is deliberately NOT exposed here. It's service-to-service only, reached
        # directly via Eureka by other services, guarded by X-Internal-Api-Key.
        # See notification-service's InternalApiKeyFilter and ARCHITECTURE.md.
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:bvvrysgguveuuggynuugrsyfnngyuwgnygnsgyngnugycutjngjhnss}

# Booking Aggregator resilience — one instance per downstream source called
# from BookingAggregatorService. All four share the same tuning via
# `base-config: default`; override per-instance here if one source turns out
# to need different tolerances later.
resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 3s
        cancel-running-future: true
    instances:
      busBookings: { base-config: default }
      rideBookings: { base-config: default }
      hotelBookings: { base-config: default }
      packageBookings: { base-config: default }
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      busBookings: { base-config: default }
      rideBookings: { base-config: default }
      hotelBookings: { base-config: default }
      packageBookings: { base-config: default }

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logstash:
  host: ${LOGSTASH_HOST:localhost}
  port: ${LOGSTASH_PORT:5000}
